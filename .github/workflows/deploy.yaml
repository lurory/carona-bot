# Runs on every push to these branches so Railway can use "Wait for CI" (see Railway service settings).
# Deploys are triggered by Railway’s GitHub integration, not by this workflow.
name: CI

on:
  push:
    branches:
      - main
      - staging

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
